<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه هدایای تلگرام</title>
    <style>
        @font-face {
            font-family: Kalameh;
            src: url('../site/font/Kalameh\ Bold.ttf');
        }

        * {
            font-family: Kalameh;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #0d111b;
            color: #f5f7ff;
        }

        header {
            padding: 45px 20px;
            text-align: center;
            background:
                radial-gradient(circle at top, #293e79, transparent 65%),
                #111827;
            border-bottom: 1px solid #273149;
        }

        header h1 {
            margin: 0 0 12px;
            font-size: clamp(25px, 5vw, 40px);
        }

        header p {
            color: #bac5df;
            line-height: 2;
            margin: 0;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 24px 16px 60px;
        }

        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        input, select {
            background: #171e2e;
            color: white;
            border: 1px solid #34405b;
            border-radius: 12px;
            padding: 13px;
            font: inherit;
            min-width: 0;
        }

        input { flex: 1; width: 220px; }
        select { width: 220px; }

        .status {
            color: #aebbd5;
            margin: 12px 0 20px;
            font-size: 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 18px;
        }

        .card {
            background: linear-gradient(150deg, #1a2336, #131a28);
            border: 1px solid #2a354c;
            border-radius: 18px;
            padding: 15px;
            min-width: 0;
            transition: transform .2s, border-color .2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #6488ff;
        }

        .image-box {
            height: 175px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0e1421;
            border-radius: 13px;
            margin-bottom: 14px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 12px;
        }

        .placeholder {
            color: #8c9ab5;
            font-size: 13px;
        }

        .badge {
            display: inline-block;
            font-size: 13px;
            padding: 6px 9px;
            border-radius: 20px;
            background: #293b66;
            color: #c9d8ff;
            margin-bottom: 10px;
        }

        .name {
            font-size: 18px;
            line-height: 1.8;
            margin: 0 0 10px;
            overflow-wrap: anywhere;
        }

        .price {
            color: #72e2bd;
            font-size: 15px;
            font-weight: bold;
            margin: 12px 0;
        }

        .muted {
            color: #99a6c0;
            font-size: 14px;
        }

        .buy {
            display: block;
            text-align: center;
            text-decoration: none;
            color: white;
            background: linear-gradient(100deg, #2879eb, #6559ed);
            border-radius: 11px;
            padding: 12px;
            margin-top: 15px;
            font-weight: bold;
        }

        .buy:hover { filter: brightness(1.12); }

        .empty {
            text-align: center;
            color: #aebbd5;
            padding: 45px 10px;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #8d9ab4;
            border-top: 1px solid #273149;
            font-size: 18px;
        }

        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .card { padding: 10px; }
            .image-box { height: 135px; }
            .name { font-size: 14px; }
            .price { font-size: 13px; }
            .filters { flex-direction: column; }
            input, select { width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎁 فروشگاه گیفت های تلگرام</h1>
        <p style="font-size: 18px;">گیفت معمولی و کلکسیونی تلگرام را مشاهده کن.<br>
        برای خرید یا استعلام قیمت، با ما در تلگرام ارتباط بگیر.</p>
    </header>

    <main class="container">
        <div class="filters">
            <input id="search" type="search" placeholder="جست‌وجوی نام گیفت...">
            <select id="type">
                <option value="all">همه گیفت‌ها</option>
                <option value="REGULAR">گیفت‌های معمولی</option>
                <option value="UPGRADED">گیفت‌های کلکسیونی</option>
                <option value="UNUPGRADED">ارتقان‌یافته‌نشده</option>
            </select>
            <select id="sort">
                <option value="default">ترتیب پیش‌فرض</option>
                <option value="low">ارزان‌ترین قیمت</option>
                <option value="high">گران‌ترین قیمت</option>
                <option value="name">ترتیب نام</option>
            </select>
        </div>

        <div class="status" id="status">در حال بارگذاری هدایا...</div>
        <section class="grid" id="grid"></section>
    </main>

    <footer>برای خرید و استعلام قیمت، روی دکمه هر گیفت بزنید.</footer>

    <script>
        const BUY_URL = "https://t.me/Hadi_Jami_1388";

        let gifts = [];

        const grid = document.getElementById("grid");
        const search = document.getElementById("search");
        const type = document.getElementById("type");
        const sort = document.getElementById("sort");
        const status = document.getElementById("status");

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[char]);
        }

        function formatPrice(price) {
            if (price === null || price === undefined) return null;
            const number = Number(price);
            if (!Number.isFinite(number) || number <= 0) return null;

            return number.toLocaleString("en-US", {
                maximumFractionDigits: 3
            });
        }

        function render() {
            const query = search.value.trim().toLowerCase();
            let filtered = gifts.filter(gift => {
                const matchesName = gift.name.toLowerCase().includes(query);
                const matchesType =
                    type.value === "all" || gift.type === type.value;

                return matchesName && matchesType;
            });

            if (sort.value === "low") {
                filtered.sort((a, b) =>
                    (a.price ?? Infinity) - (b.price ?? Infinity)
                );
            } else if (sort.value === "high") {
                filtered.sort((a, b) =>
                    (b.price ?? -1) - (a.price ?? -1)
                );
            } else if (sort.value === "name") {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }

            status.textContent =
                `${filtered.length.toLocaleString("fa-IR")} گیفت`;

            if (!filtered.length) {
                grid.innerHTML = '<div class="empty">گیفت‌ای پیدا نشد.</div>';
                return;
            }

            grid.innerHTML = filtered.map(gift => {
                const name = escapeHtml(gift.name);
                const label = escapeHtml(gift.typeLabel);
                const price = formatPrice(gift.price);

                const image = gift.image
                    ? `<img src="${escapeHtml(gift.image)}"
                         alt="${name}" loading="lazy"
                         onerror="this.parentElement.innerHTML='<span class=&quot;placeholder&quot;>تصویر در دسترس نیست</span>'">`
                    : '<span class="placeholder">تصویر در دسترس نیست</span>';

                const priceHtml = price
                    ? `<div class="price">${price} TON</div>`
                    : '<div class="price muted">قیمت موجود نیست</div>';

                return `
                    <article class="card">
                        <div class="image-box">${image}</div>
                        <span class="badge">${label}</span>
                        <h2 class="name">${name}</h2>
                        ${priceHtml}
                        <a class="buy"
                           href="${BUY_URL}"
                           target="_blank"
                           rel="noopener noreferrer">استعلام خرید در تلگرام</a>
                    </article>
                `;
            }).join("");
        }

        search.addEventListener("input", render);
        type.addEventListener("change", render);
        sort.addEventListener("change", render);

        fetch("./gifts.json")
            .then(response => {
                if (!response.ok) throw new Error("خطا در دریافت اطلاعات");
                return response.json();
            })
            .then(data => {
                gifts = data;
                render();
            })
            .catch(error => {
                status.textContent = "بارگذاری اطلاعات ناموفق بود.";
                grid.innerHTML =
                    '<div class="empty">فایل اطلاعات هدایا بارگذاری نشد. برنامه را دوباره اجرا کنید.</div>';
                console.error(error);
            });
    </script>
</body>
</html>
